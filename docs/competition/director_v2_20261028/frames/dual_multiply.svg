<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="镜头05 并行，不是快放" style="font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif"><defs><radialGradient id="shot05_19_bg"><stop stop-color="#263d45"/><stop offset="1" stop-color="#0a141b"/></radialGradient><radialGradient id="shot05_19_pool"><stop stop-color="#637674" stop-opacity=".55"/><stop offset="1" stop-color="#22343b" stop-opacity="0"/></radialGradient><linearGradient id="shot05_19_screen" x2="0" y2="1"><stop stop-color="#435b60"/><stop offset="1" stop-color="#20333c"/></linearGradient><linearGradient id="shot05_19_cap" x2=".5" y2="1"><stop stop-color="#e58572"/><stop offset="1" stop-color="#b23739"/></linearGradient><marker id="shot05_19_arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10" fill="#e3b768"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#shot05_19_bg)" /><text x="145" y="250" fill="#9eabae" font-size="30" >同一个输入</text><rect x="150" y="290" width="160" height="115" rx="12" fill="#315c63" /><text x="230" y="360" fill="#73d7ce" font-size="58" text-anchor="middle">x</text><rect x="480" y="210" width="160" height="90" rx="12" fill="#65416c" /><text x="560" y="268" fill="#d2b5e2" font-size="42" text-anchor="middle">w₀</text><rect x="480" y="365" width="160" height="90" rx="12" fill="#65416c" /><text x="560" y="425" fill="#d2b5e2" font-size="42" text-anchor="middle">w₁</text><path d="M310 346L740 346" fill="none" stroke="#73d7ce" stroke-width="4" /><path d="M640 255L740 346" fill="none" stroke="#d2b5e2" stroke-width="3" /><path d="M640 410L740 346" fill="none" stroke="#d2b5e2" stroke-width="3" /><rect x="740" y="260" width="280" height="180" rx="12" fill="#213a42" stroke="#e3b768" stroke-width="3"/><text x="880" y="325" fill="#e3b768" font-size="36" text-anchor="middle">打包乘法</text><text x="880" y="380" fill="#ebe8df" font-size="25" text-anchor="middle">拆分 + 符号修正</text><path d="M1020 346L1230 260" fill="none" stroke="#73d7ce" stroke-width="4" /><path d="M1020 346L1230 430" fill="none" stroke="#caa7dc" stroke-width="4" /><text x="1250" y="275" fill="#73d7ce" font-size="46" >x·w₀</text><text x="1250" y="445" fill="#caa7dc" font-size="46" >x·w₁</text><text x="150" y="630" fill="#ebe8df" font-size="40" >1 个 DSP，两个共享输入的 INT8 乘积</text><text x="150" y="691" fill="#9eabae" font-size="24" >不同输入的两对乘法，不能按此方式任意打包。</text><rect x="0" y="0" width="1600" height="86" rx="0" fill="#09131a" /><text x="46" y="52" fill="#e3b768" font-size="27" >SHOT 05</text><text x="225" y="52" fill="#ebe8df" font-size="29" >并行，不是快放</text><text x="1550" y="52" fill="#9eabae" font-size="21" text-anchor="end">原理 / 合成预演 · 非实测录像</text><rect x="0" y="828" width="1600" height="72" rx="0" fill="#09131a" /><text x="46" y="872" fill="#9eabae" font-size="23" >同输入的双乘积 → 48×8逻辑阵列</text><text x="1550" y="872" fill="#e3b768" font-size="23" text-anchor="end">49–64 s  /  15 s</text></svg>